services:
  ukesmeny:
    build: .
    container_name: ukesmeny
    restart: unless-stopped
    ports:
      - "8099:8000"          # app: http://<server-ip>:8099
    env_file: .env
    environment:
      - TZ=Europe/Oslo
    volumes:
      - ./data:/data         # database, preferences, backups, login
